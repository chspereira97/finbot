<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBot - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .login-container { max-width: 400px; margin-top: 80px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 login-container">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">💰 FinBot - Login</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="chaveLogin" class="form-label">Chave de Login</label>
                                <input type="text" class="form-control" id="chaveLogin" placeholder="Ex: FIN-ABC123" required>
                            </div>
                            <div class="mb-3">
                                <label for="chaveSenha" class="form-label">Chave de Senha</label>
                                <input type="password" class="form-control" id="chaveSenha" placeholder="Ex: FIN-XYZ789" required>
                            </div>
                            <div id="errorMessage" class="alert alert-danger d-none"></div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const chaveLogin = document.getElementById('chaveLogin').value.trim();
            const chaveSenha = document.getElementById('chaveSenha').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('d-none');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chave_login: chaveLogin,
                        chave_senha: chaveSenha
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = '/dashboard/';
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.detail || 'Chaves inválidas';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
