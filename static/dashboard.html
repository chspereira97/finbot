<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBot - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f8f9fa; }
        .card { border-radius: 12px; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">💰 FinBot</a>
            <div class="d-flex">
                <span class="navbar-text me-3" id="userName">Usuário</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Cards de resumo -->
        <div class="row mb-4" id="resumoCards">
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Receitas</h6>
                        <h3 class="text-success" id="totalReceitas">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Despesas</h6>
                        <h3 class="text-danger" id="totalDespesas">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Saldo</h6>
                        <h3 class="text-primary" id="totalSaldo">R$ 0,00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Mês</h6>
                        <h5 id="mesAtual">Julho/2026</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="row mb-3">
            <div class="col-md-3">
                <select id="filtroCategoria" class="form-select form-select-sm">
                    <option value="">Todas categorias</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filtroForma" class="form-select form-select-sm">
                    <option value="">Todas formas</option>
                    <option value="pix">Pix</option>
                    <option value="credito">Crédito</option>
                    <option value="debito">Débito</option>
                    <option value="dinheiro">Dinheiro</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filtroTipo" class="form-select form-select-sm">
                    <option value="">Todos os tipos</option>
                    <option value="R">Receitas</option>
                    <option value="D">Despesas</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filtroMes" class="form-select form-select-sm">
                </select>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h6>Gastos por Categoria</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="categoriaChart" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h6>Evolução Mensal</h6>
                    </div>
                    <div class="card-body">
                        <canvas id="evolucaoChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de transações -->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h6>Transações</h6>
                <span class="badge bg-secondary" id="totalTransacoes">0 registros</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-hover" id="transacoesTable">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Forma</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="transacoesBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
<!-- Modal de Edição -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">✏️ Editar Transação</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="mb-2">
                        <label class="form-label">Valor</label>
                        <input type="number" step="0.01" class="form-control" id="editValor" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Descrição</label>
                        <input type="text" class="form-control" id="editDescricao">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="editCategoria" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Forma de Pagamento</label>
                        <select class="form-control" id="editForma">
                            <option value="">Selecione</option>
                            <option value="pix">Pix</option>
                            <option value="credito">Crédito</option>
                            <option value="debito">Débito</option>
                            <option value="dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Data</label>
                        <input type="date" class="form-control" id="editData" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="saveEditBtn">Salvar</button>
            </div>
        </div>
    </div>
</div>
