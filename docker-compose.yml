services:
  postgres:
    image: postgres:16
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-evolution}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:-evolution}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no arquivo .env}"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "${EVOLUTION_DATABASE_URL:?Defina EVOLUTION_DATABASE_URL no arquivo .env}"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/6"
      WEBHOOK_GLOBAL_URL: "${WEBHOOK_GLOBAL_URL:?Defina WEBHOOK_GLOBAL_URL no arquivo .env}"
      WEBHOOK_GLOBAL_ENABLED: "true"

volumes:
  postgres_data:
